name: capability-analysis

services:
  backend:
    build:
      context: ./backend
    environment:
      CAPABILITY_RAW_DATA: /data/raw/final_revised.csv
      CAPABILITY_USERS_DATA: /data/raw/tbl_users_1.csv
      CAPABILITY_ATTEMPTS_PATH: /app/data/processed/question_attempts.csv
      CAPABILITY_SUMMARY_PATH: /app/data/processed/student_topic_summary.csv
      CAPABILITY_EMAIL_LOOKUP_PATH: /app/data/processed/student_email_lookup.csv
      CAPABILITY_CHAPTER_SUMMARY_PATH: /app/data/processed/student_latest_chapter_summary.csv
      CAPABILITY_EMAIL_LOOKUP_SECRET: ${CAPABILITY_EMAIL_LOOKUP_SECRET:-local-development-only-change-me}
    volumes:
      - capability-data:/app/data/processed
      - type: bind
        source: ${CAPABILITY_RAW_DATA_HOST:-../Final/final_revised.csv}
        target: /data/raw/final_revised.csv
        read_only: true
      - type: bind
        source: ${CAPABILITY_USERS_DATA_HOST:-../tables_chosen/tbl_users_1.csv}
        target: /data/raw/tbl_users_1.csv
        read_only: true
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Initial CSV preparation can take several minutes on the 1.2 GB export.
      start_period: 15m

  frontend:
    build:
      context: ./frontend
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8082}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  capability-data:
